<!doctype html><html lang='pt-BR'><head><meta charset='utf-8'><style>body{margin:0;background:#000}*{box-sizing:border-box}
.pg{width:1080px;height:1350px;padding:64px 80px;background:#000;color:#F7F7F7;font-family:Saira,Arial,sans-serif;position:relative;overflow:hidden;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between}
.kick{font-size:28px;font-weight:700;letter-spacing:3px;text-transform:uppercase}
.h{font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:-1.5px;line-height:.98}
.card{background:#1D1D1D;border:2px solid #343434;border-radius:18px}
.sub{font-size:32px;font-weight:500;line-height:1.38;color:#B7B7B7;margin:0}
</style></head><body>
<div class='pg'>
<div class='top'><img src='{{LOGO}}' style='width:140px;height:105px;object-fit:contain'><span style='font-size:26px;font-weight:700;color:#B7B7B7'>3 / 6</span></div>
<span class='kick' style='margin-top:40px;color:#EE3124'>No LigFlow</span>
<span class='h' style='margin-top:10px;font-size:84px'>Pediu retorno?<br>Agenda na hora.</span>
<div class='card' style='margin-top:48px;padding:36px 40px;border-color:#EE3124;border-width:3px;box-shadow:0 24px 70px rgba(238,49,36,.22)'>
<div style='display:flex;align-items:center;justify-content:space-between'>
<div style='display:flex;align-items:center;gap:18px'><span style='width:18px;height:18px;border-radius:50%;background:#EE3124'></span><span style='font-size:34px;font-weight:800'>Lead 07</span></div>
<span style='font-size:24px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#FF7A70'>Em ligação</span></div>
<div style='margin-top:30px;display:grid;grid-template-columns:1fr 1fr;gap:18px'>
<div style='padding:20px 24px;border-radius:12px;background:#0F0F0F;border:2px solid #343434'><span style='font-size:22px;color:#B7B7B7;text-transform:uppercase;letter-spacing:2px;font-weight:700'>Tipo</span><br><span style='font-size:32px;font-weight:700'>Retorno</span></div>
<div style='padding:20px 24px;border-radius:12px;background:#0F0F0F;border:2px solid #343434'><span style='font-size:22px;color:#B7B7B7;text-transform:uppercase;letter-spacing:2px;font-weight:700'>Quando</span><br><span style='font-size:32px;font-weight:700'>Terça · 14h</span></div>
<div style='grid-column:1 / 3;padding:20px 24px;border-radius:12px;background:#0F0F0F;border:2px solid #343434'><span style='font-size:22px;color:#B7B7B7;text-transform:uppercase;letter-spacing:2px;font-weight:700'>Observação</span><br><span style='font-size:30px;font-weight:600'>Pediu para ligar semana que vem</span></div>
</div>
<div style='margin-top:28px;padding:24px;border-radius:14px;background:#EE3124;text-align:center'><span class='h' style='font-size:36px;letter-spacing:0'>Salvar no Google Agenda</span></div>
</div>
<div style='flex:1'></div>
<p class='sub'>Agendou no LigFlow, o retorno vai para o Google Agenda com o lead e o combinado.</p>
<span style='margin-top:14px;font-size:20px;color:#6E6E6E'>Ilustração. Nomes e horários de exemplo.</span>
</div></body></html>
