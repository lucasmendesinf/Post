<!doctype html><html lang='pt-BR'><head><meta charset='utf-8'><style>body{margin:0;background:#000}</style></head><body>

<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 64px 80px 64px; background: #000000; color: #F7F7F7; font-family: Saira, Arial, Helvetica, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between">
<img src="{{LOGO}}" alt="Logo LigFlow" style="width: 140px; height: 105px; object-fit: contain; display: block">
<span style="font-size: 26px; font-weight: 700; color: #B7B7B7">4 / 6</span>
</div>

<span style="margin-top: 40px; font-size: 28px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #EE3124">Passo 3</span>
<div style="margin-top: 8px; display: flex; align-items: baseline; gap: 24px">
<span style="font-size: 200px; font-weight: 900; font-style: italic; line-height: 0.85; letter-spacing: -4px; color: #EE3124">ALÔ!</span>
<span style="font-size: 48px; font-weight: 900; font-style: italic; line-height: 1; text-transform: uppercase; color: #FFFFFF">atendeu?<br>chega pra você</span>
</div>

<div style="margin-top: 56px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 32px; font-weight: 700">Discando</span>
<span style="font-size: 30px; font-weight: 700; color: #B7B7B7">até 10 linhas ao mesmo tempo</span>
</div>
<div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 8px">
<span style="height: 56px; border-radius: 8px; background: #EE3124"></span>
<span style="height: 56px; border-radius: 8px; background: #EE3124"></span>
<span style="height: 56px; border-radius: 8px; background: #EE3124"></span>
<span style="height: 56px; border-radius: 8px; background: #EE3124"></span>
<span style="height: 56px; border-radius: 8px; background: #EE3124"></span>
<span style="height: 56px; border-radius: 8px; background: #EE3124"></span>
<span style="height: 56px; border-radius: 8px; background: #EE3124"></span>
<span style="height: 56px; border-radius: 8px; background: #EE3124"></span>
<span style="height: 56px; border-radius: 8px; background: #EE3124"></span>
<span style="height: 56px; border-radius: 8px; background: #EE3124"></span>
</div>
</div>

<div style="margin-top: 32px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 32px; font-weight: 800; color: #EE3124">Para o consultor</span>
<span style="font-size: 30px; font-weight: 700; color: #F7F7F7">só quem atendeu</span>
</div>
<div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 8px">
<span style="height: 56px; border-radius: 8px; background: #1D1D1D; border: 2px dashed #343434"></span>
<span style="height: 56px; border-radius: 8px; background: #1D1D1D; border: 2px dashed #343434"></span>
<span style="height: 56px; border-radius: 8px; background: #1D1D1D; border: 2px dashed #343434"></span>
<span style="height: 56px; border-radius: 8px; background: #1D1D1D; border: 2px dashed #343434"></span>
<span style="height: 56px; border-radius: 8px; background: #FFCF22"></span>
<span style="height: 56px; border-radius: 8px; background: #1D1D1D; border: 2px dashed #343434"></span>
<span style="height: 56px; border-radius: 8px; background: #1D1D1D; border: 2px dashed #343434"></span>
<span style="height: 56px; border-radius: 8px; background: #1D1D1D; border: 2px dashed #343434"></span>
<span style="height: 56px; border-radius: 8px; background: #1D1D1D; border: 2px dashed #343434"></span>
<span style="height: 56px; border-radius: 8px; background: #1D1D1D; border: 2px dashed #343434"></span>
</div>
</div>

<div style="margin-top: 52px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<div style="padding: 28px; border-radius: 16px; background: #1D1D1D; border: 2px solid #343434; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 24px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #B7B7B7">Não atendeu</span>
<span style="font-size: 34px; font-weight: 700; line-height: 1.2">Caixa postal e ocupado ficam para trás</span>
</div>
<div style="padding: 28px; border-radius: 16px; background: #3A1412; border: 2px solid #EE3124; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 24px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #FF7A70">Atendeu</span>
<span style="font-size: 34px; font-weight: 700; line-height: 1.2">A ligação cai direto com você</span>
</div>
</div>

<div style="flex: 1"></div>

<p style="margin: 0; font-size: 20px; font-weight: 500; line-height: 1.4; color: #7A7A7A">Ilustração. O número de atendimentos varia conforme a lista e a taxa de atendimento.</p>

</div>
</body></html>
